# Golden path de référence : <dossier des templates>/<nom>/template.yaml, dans
# le repo des golden paths (section templates de la configuration). Le dossier
# porte aussi le squelette du repo créé et son template de CI.
#
#   templates/
#     api-rest-go/
#       template.yaml        ← ce fichier
#       ci.gitlab-ci.yml     ← CI du repo créé (spec.ci_template)
#       skeleton/            ← fichiers du repo créé (spec.skeleton)
#
#   symphony validate -config symphony.yaml -templates templates/
#
# Une clé inconnue est une erreur. Un golden path invalide est refusé seul :
# les autres restent proposés, et la page Administration dit pourquoi.
# Dans le squelette et le template de CI, ces variables sont remplacées à la
# création du projet : {{SERVICE_NAME}}, {{SERVICE_DESCRIPTION}},
# {{LANGUAGE}}, {{TYPE}}, {{PORT}}, {{YEAR}}.

apiVersion: symphony/v1
kind: GoldenPath # requis
metadata:
  name: api-rest-go # requis : le nom du dossier (minuscules, chiffres, tirets)
  title: API REST Go # affiché dans le catalogue ; défaut : name
  description: API REST avec logs structurés, healthcheck et métriques
  icon: go # réservé : le catalogue choisit l'icône d'après spec.language
spec:
  language: go # go, python, node… (icône et étiquette du catalogue)
  type: api # api, worker…
  # Providers du projet, par id dans la configuration ; vide : celui par
  # défaut. Le CI doit tourner sur la plateforme du SCM (gitlab_ci sur
  # gitlab, github_actions sur github).
  providers:
    scm: gitlab
    ci: gitlab-ci
    registry: gitlab-registry # facultatif
    runtime: docker
  skeleton: skeleton # dossier du squelette, relatif au template ; défaut skeleton
  ci_template: ci.gitlab-ci.yml # requis : relatif au template
  # Runtime par environnement, à la place de celui de la configuration
  # (ex. une API qui tourne sur Kubernetes dès staging)
  environments:
    staging: argocd
