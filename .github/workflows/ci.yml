name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (format, vet, tests, build)
    runs-on: ubuntu-latest
    # PostgreSQL jetable : les tests de internal/database (SYMPHONY_TEST_DB=1)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: symphony
          POSTGRES_PASSWORD: symphony123
          POSTGRES_DB: symphony
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U symphony" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "Fichiers à formater avec gofmt :"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
        env:
          SYMPHONY_TEST_DB: "1"
      - run: go build ./cmd/symphony

  front:
    name: Front (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  helm:
    name: Chart Helm (lint, installation sur kind)
    needs: [go, front]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5.0.1
      - run: helm lint deploy/helm/symphony
      - uses: helm/kind-action@v1.15.0
      - name: Image de Symphony dans kind
        run: |
          docker build -t symphony:ci .
          kind load docker-image symphony:ci --name chart-testing
      - name: Installation (PostgreSQL jetable, configuration hors ligne)
        run: |
          kubectl create namespace symphony
          kubectl -n symphony apply -f deploy/helm/e2e/postgres.yaml
          helm install symphony deploy/helm/symphony -n symphony -f deploy/helm/e2e/values.yaml --wait --timeout 5m
      - name: Symphony répond (santé, API, UI)
        run: |
          kubectl -n symphony port-forward svc/symphony 8080:80 &
          sleep 5
          curl -sf localhost:8080/healthz
          curl -sf localhost:8080/api/v1/me | grep -q '"role":"admin"'
          curl -sf localhost:8080/ | grep -q '<title>Symphony</title>'
      - name: Logs en cas d'échec
        if: failure()
        run: kubectl -n symphony describe pods; kubectl -n symphony logs deploy/symphony --all-containers || true

  image:
    name: Image Docker
    needs: [go, front]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion à ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/symphony
          # Tag v0.1 → :0.1 et :latest (type=semver exigerait X.Y.Z)
          tags: |
            type=ref,event=branch
            type=match,pattern=^v(\d+\.\d+(\.\d+)?)$,group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      # Pull request : on vérifie seulement que l'image se construit
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
