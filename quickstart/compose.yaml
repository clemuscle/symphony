# Quickstart : Symphony et PostgreSQL sur une machine, branchés sur une forge
# existante (gitlab.com, GitLab auto-hébergée ou GitHub). Voir README.md.
#
#   cp .env.example .env    # puis le remplir
#   docker compose up -d    # http://localhost:8080

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: symphony
      POSTGRES_PASSWORD: ${DB_PASSWORD:?à définir dans .env}
      POSTGRES_DB: symphony
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U symphony"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  symphony:
    image: ${SYMPHONY_IMAGE:-ghcr.io/clemuscle/symphony:${SYMPHONY_VERSION:-0.12}}
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    environment:
      SYMPHONY_CONFIG: /etc/symphony/symphony.yaml
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      # Jeton de la forge, lu par la configuration (secret://env/FORGE_TOKEN) :
      # jamais écrit dans un fichier de configuration
      FORGE_TOKEN: ${FORGE_TOKEN:?à définir dans .env}
      FORGE_URL: ${FORGE_URL:-}
      FORGE_GROUP: ${FORGE_GROUP:-}
      REGISTRY_HOST: ${REGISTRY_HOST:-}
      STACKS_REPO: ${STACKS_REPO:-}
    ports:
      - "${SYMPHONY_PORT:-8080}:8080"
    volumes:
      # symphony.gitlab.yaml ou symphony.github.yaml ; relu toutes les 15 s
      - ./symphony.${FORGE:-gitlab}.yaml:/etc/symphony/symphony.yaml:ro
    restart: unless-stopped

  # Runtime docker : les services créés tournent en conteneurs sur cette
  # machine. Symphony ne monte pas le socket Docker (un accès root) : il passe
  # par ce proxy, limité aux conteneurs et aux images.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      DELETE: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  postgres_data:
