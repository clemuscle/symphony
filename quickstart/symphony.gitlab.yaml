# Configuration du quickstart, GitLab (gitlab.com ou auto-hébergée). Toutes
# les clés : documentation/reference/symphony.yaml. Relue toutes les 15 s :
# une modification est appliquée à chaud, une erreur est refusée et
# expliquée dans la page Administration.
#
# Stacks : le catalogue officiel de Symphony (embarqué), qui suit les
# providers par défaut ci-dessous, et celles de STACKS_REPO s'il est défini.

providers:
  scm:
    - id: gitlab
      type: gitlab
      config:
        url: ${FORGE_URL}
        token: secret://env/FORGE_TOKEN
        namespace: ${FORGE_GROUP}
  ci:
    - id: gitlab-ci
      type: gitlab_ci
      config:
        url: ${FORGE_URL}
        scm_ref: gitlab
  registry:
    - id: gitlab-registry
      type: gitlab_registry
      config:
        url: ${FORGE_URL}
        registry_host: ${REGISTRY_HOST}
        scm_ref: gitlab
  runtime:
    - id: docker
      type: docker
      config:
        socket: tcp://docker-proxy:2375

stacks:
  repo: ${STACKS_REPO} # vide : catalogue officiel seul
  path: stacks
  official: ["*"]

# Pas de section auth : authentification désactivée, tout le monde est admin.
# Pour un usage à plusieurs : section auth et provider identity (OIDC), voir
# la configuration de référence.
#
# Pas de section webhooks : gitlab.com ne peut pas joindre ce poste, Symphony
# suit les pipelines par sondage (15 s).
