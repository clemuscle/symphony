# Configuration du quickstart, GitHub (repos, GitHub Actions, images sur
# ghcr.io). Toutes les clés : documentation/reference/symphony.yaml. Relue
# toutes les 15 s : une modification est appliquée à chaud, une erreur est
# refusée et expliquée dans la page Administration.
#
# Stacks : le catalogue officiel de Symphony (embarqué), qui suit les
# providers par défaut ci-dessous, et celles de STACKS_REPO s'il est défini.

providers:
  scm:
    - id: github
      type: github
      config:
        token: secret://env/FORGE_TOKEN
        org: ${FORGE_GROUP}
  ci:
    - id: github-actions
      type: github_actions
      config:
        scm_ref: github
  registry:
    - id: ghcr
      type: ghcr
      config:
        owner: ${FORGE_GROUP}
        scm_ref: github
  runtime:
    - id: docker
      type: docker
      config:
        socket: tcp://docker-proxy:2375

stacks:
  repo: ${STACKS_REPO} # vide : catalogue officiel seul
  path: stacks
  official: ["*"]

# Pas de section auth : authentification désactivée, tout le monde est admin.
# Pas de section webhooks : GitHub ne peut pas joindre ce poste, Symphony
# suit les workflows par sondage (15 s).
#
# Services existants : décommenter pour que chaque repo de l'organisation (ou
# du compte) qui a une fiche catalog-info.yaml (Component Backstage) devienne
# un projet, sans que Symphony n'y écrive rien.
# catalogue:
#   discovery:
#     sources:
#       - group: mon-organisation
