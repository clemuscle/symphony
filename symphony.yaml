# Bootstrap de Symphony : comment joindre le repo qui contient la configuration
# (providers, catalogue, stacks). Le reste est dans root/symphony-config.
#
# Sans config_source, ce fichier est lu comme une configuration complète
# (format de root/symphony-config/symphony.yaml), pour travailler hors ligne.
config_source:
  scm:
    type: gitlab
    config:
      url: http://gitlab.local:8929
      token: secret://env/GITLAB_TOKEN
  repo: root/symphony-config
  branch: main
  path: symphony.yaml
