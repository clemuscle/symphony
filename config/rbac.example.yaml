roles:
  admin:
    # OIDC groups whose members receive the 'admin' role.
    # Admins can configure Symphony (setup wizard, config reload, template reload)
    # and do everything developers can.
    # If empty, nobody is admin — SYMPHONY_DEV_MODE=1 bypasses this for local dev.
    groups:
      - devops-team
      - platform-admins

  lead:
    # OIDC groups whose members receive the 'lead' role (chef de projet / tech lead).
    # Leads can deploy to production and stop production containers, in addition
    # to all developer actions. They cannot configure the platform itself.
    # If empty, nobody has the lead role — production deploys require admin.
    groups:
      - tech-leads
      - project-leads

  developer:
    # OIDC groups whose members receive the 'developer' role.
    # Developers can create projects, trigger CI pipelines, and deploy staging
    # environments (recettes). They cannot deploy to production.
    # If this list is empty, every authenticated user is treated as a developer
    # (permissive default for small teams that don't need RBAC yet).
    groups:
      - developers
      - backend
      - frontend

  # viewer is the implicit default for any authenticated user not matched above.
  # Viewers have read-only access to all resources.

# project_groups scopes WHICH projects a role can act on / see, on top of the
# roles above which already decide WHAT a role can do. A project belongs to
# exactly one group (projects.owner_group), assigned by an admin at creation
# and transferable later (PUT /api/v1/projects/{name}/group, admin-only).
#
# Opt-in, all-or-nothing: leave this list empty (or omit it) and project
# scoping stays fully disabled — every developer/lead can act on every
# project, exactly like Symphony behaved before this feature existed. A
# non-empty list activates scoping everywhere at once; there is no per-project
# opt-in, so the model stays auditable. admin always bypasses this dimension —
# it only ever gates lead/developer/viewer.
#
# name is what gets stored on a project and shown in the UI — it must stay
# stable even if the underlying OIDC claim is an unreadable object ID (Azure
# AD emits GUIDs in the "groups" claim, not names). oidc_groups lists every
# claim that should map to this Symphony group; list both a team's dev and
# lead OIDC groups here if they should share one project group.
#
# project_groups:
#   - name: team-paiements
#     description: "Équipe paiements"
#     oidc_groups:
#       - paiements-devs
#       - paiements-leads
#   - name: team-plateforme
#     description: "Équipe plateforme / DevOps"
#     oidc_groups:
#       - devops-team
