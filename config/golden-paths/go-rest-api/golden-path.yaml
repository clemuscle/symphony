apiVersion: symphony/v1
kind: GoldenPath
metadata:
  name: go-rest-api
  description: "REST API en Go avec healthcheck et métriques Prometheus"
  icon: go
spec:
  language: go
  type: rest-api
  default_port: 8080
  # Plafond de durée de vie qu'un dev peut choisir à la création d'une
  # recette (ttl_hours du body POST .../recettes) — requis, voir
  # documentation/backlog.md EPIC H.
  recette_max_ttl_hours: 72
