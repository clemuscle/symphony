# Réglages d'Argo CD pour la démo, appliqués par up.sh après l'installation.

# API et UI en HTTP (démo locale), publiées sur le NodePort 30080
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
data:
  server.insecure: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-server-nodeport
  namespace: argocd
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
---
# Compte de service de Symphony : jeton d'API seulement (pas de connexion à l'UI)
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  accounts.symphony: apiKey
---
# Droits de Symphony : les Applications du projet default et leurs journaux,
# rien d'autre (ni clusters, ni repos, ni comptes)
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
data:
  policy.csv: |
    p, role:symphony, applications, *, default/*, allow
    p, role:symphony, logs, get, default/*, allow
    g, symphony, role:symphony
