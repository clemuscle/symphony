apiVersion: symphony/v1
kind: Service
metadata:
  name: "payment-api"
  owner: "team-fintech"
  team:
    slack: "#team-fintech"
    email: "fintech@company.com"
  tags:
    - "rest-api"
    - "paiement"
    - "critique"
  tier: "critical"
  lifecycle: "production"
spec:
  type: "rest-api"
  language: "go"
  version: "2.3.1"
  docs: "https://wiki.company.com/payment-api"
  links:
    - title: "Grafana"
      url: "https://grafana.company.com/d/payment"
      icon: "monitoring"
    - title: "Sentry"
      url: "https://sentry.io/payment-api"
      icon: "errors"
    - title: "Runbook"
      url: "https://wiki.company.com/runbook"
      icon: "docs"
  dependencies:
    - service: "postgres-main"
      type: "database"
    - service: "redis-cache"
      type: "cache"
  slo:
    availability: "99.9%"
    latency_p99: "200ms"
