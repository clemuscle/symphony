apiVersion: symphony/v1
kind: Service
metadata:
  name: "notification-worker"
  owner: "team-product"
  team:
    slack: "#team-product"
    email: "product@company.com"
  tags:
    - "worker"
    - "notifications"
    - "async"
  tier: "standard"
  lifecycle: "production"
spec:
  type: "worker"
  language: "python"
  version: "1.2.0"
  links:
    - title: "Grafana"
      url: "https://grafana.company.com/d/notifications"
      icon: "monitoring"
  dependencies:
    - service: "rabbitmq"
      type: "queue"
    - service: "postgres-main"
      type: "database"
  slo:
    availability: "99.5%"
    latency_p99: "2s"
