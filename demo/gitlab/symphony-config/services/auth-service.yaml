apiVersion: symphony/v1
kind: Service
metadata:
  name: "auth-service"
  owner: "team-platform"
  team:
    slack: "#team-platform"
    email: "platform@company.com"
  tags:
    - "rest-api"
    - "auth"
    - "critique"
  tier: "critical"
  lifecycle: "production"
spec:
  type: "rest-api"
  language: "python"
  version: "1.8.0"
  links:
    - title: "Grafana"
      url: "https://grafana.company.com/d/auth"
      icon: "monitoring"
    - title: "Runbook"
      url: "https://wiki.company.com/auth/runbook"
      icon: "docs"
  dependencies:
    - service: "postgres-main"
      type: "database"
    - service: "redis-cache"
      type: "cache"
  slo:
    availability: "99.95%"
    latency_p99: "100ms"
