# Configuration de Symphony (démo), relue toutes les 15 s : une version
# valide est appliquée à chaud, une version invalide est refusée et la
# précédente reste en place. Les ${VAR} viennent de l'environnement de
# Symphony ; les secrets n'apparaissent jamais ici : secret://<provider>/<chemin>#<clé>
# les lit dans Vault (relus à chaque cycle : une rotation est appliquée à chaud).

providers:
  # Lus en premier : les autres providers y font référence
  secrets:
    - id: vault
      type: vault
      default: true
      config:
        url: http://vault:8200
        role_id: secret://env/VAULT_ROLE_ID
        secret_id: secret://env/VAULT_SECRET_ID

  # Connexion des utilisateurs (OIDC) et annuaire : les groupes du realm sont
  # proposés comme équipe propriétaire à la création d'un projet
  identity:
    - id: keycloak
      type: keycloak
      default: true
      config:
        url: http://keycloak:8080 # vu par Symphony
        public_url: http://localhost:${KEYCLOAK_PORT} # vu par le navigateur
        realm: symphony
        client_id: symphony
        directory_client_id: symphony-directory
        directory_client_secret: secret://vault/symphony/keycloak#directory_secret

  scm:
    - id: gitlab-local
      type: gitlab
      default: true
      config:
        url: http://gitlab:${GITLAB_PORT}
        token: secret://vault/symphony/gitlab#token
        # Groupe des projets créés : ouvert aux développeurs, à part des
        # repos de la plateforme (groupe platform)
        namespace: apps
    # github:début — GitHub (stacks *-github) : retiré par
    # up.sh sans GITHUB_TOKEN. Repos créés dans le compte du jeton (ou org: …)
    - id: github
      type: github
      config:
        token: secret://vault/symphony/github#token
    # github:fin

  ci:
    - id: gitlab-ci
      type: gitlab_ci
      default: true
      config:
        url: http://gitlab:${GITLAB_PORT}
        scm_ref: gitlab-local # même jeton que le SCM
    # github:début
    - id: github-actions
      type: github_actions
      config:
        scm_ref: github
    # github:fin

  registry:
    - id: gitlab-registry
      type: gitlab_registry
      default: true
      config:
        url: http://gitlab:${GITLAB_PORT}
        # Vu depuis la machine : c'est le daemon Docker qui tire les images
        registry_host: localhost:${REGISTRY_PORT}
        scm_ref: gitlab-local
    # github:début — images publiées par le workflow sur ghcr.io/<owner>/<repo>
    - id: ghcr
      type: ghcr
      config:
        scm_ref: github
    # github:fin

  runtime:
    - id: docker-local
      type: docker
      default: true
      config:
        # Proxy de socket (docker-compose.yml) : pas de socket Docker monté
        # dans Symphony
        socket: tcp://docker-proxy:2375

    # k8s:début — retiré par up.sh --no-k8s (supprimer un projet passe par
    # chaque runtime : un runtime injoignable la bloquerait)
    # Kubernetes en GitOps : Symphony commite les manifests de chaque service
    # dans platform/symphony-deployments, Argo CD (dans k3s) les applique
    - id: argocd-k3s
      type: argocd
      config:
        url: http://k3s:30080
        token: secret://vault/symphony/argocd#token
        scm_ref: gitlab-local
        repo: platform/symphony-deployments
        branch: main
        path: apps
        # Le même repo vu par Argo CD, depuis un pod (relais gitlab-proxy)
        repo_url: http://k3s:${GITLAB_PORT}/platform/symphony-deployments.git
        namespace: symphony-apps
        # Chaque service répond sur http://<service>-<env>.localhost:<K8S_HTTP_PORT>
        ingress_domain: localhost
        ingress_port: ${K8S_HTTP_PORT}
        # Secrets des applis : External Secrets Operator les lit dans Vault
        # (ClusterSecretStore créé par up.sh), jamais de valeur dans Git
        secret_store: symphony-vault
        secret_store_provider: vault
    # k8s:fin

  # slack:début — canal Slack de la démo (SLACK_WEBHOOK_URL, gardé dans Vault)
  notifications:
    - id: slack
      type: slack
      config:
        webhook_url: secret://vault/symphony/notifications#webhook_url
  # slack:fin

# Environnements, dans l'ordre de promotion. production est protégée : on n'y
# déploie qu'une image déjà saine en staging (promotion). Une stack peut
# changer le runtime d'un environnement (api-rest-go-k8s : staging sur k3s).
environments:
  - name: staging
    runtime: docker-local
  - name: production
    runtime: argocd-k3s # docker-local sans Kubernetes (up.sh --no-k8s)
    protected: true
    # Une promotion demandée par un developer (bob) attend l'accord d'un lead
    # de l'équipe du projet (lina pour team-payments) ou d'un admin
    approval: lead

# Webhooks entrants : chaque repo créé par Symphony le prévient de l'avancement
# de ses pipelines (sinon, sondage toutes les 15 s)
webhooks:
  url: http://symphony:8080 # Symphony vu par GitLab
  secret: secret://vault/symphony/webhook#secret

# Catalogue : chaque projet porte sa fiche (équipe, tier, SLO, liens, actions)
# dans son propre repo, à la racine : un Component Backstage
catalogue:
  file: catalog-info.yaml
  # Services existants : les repos du groupe services qui ont une fiche
  # deviennent des projets (invoice-service, poussé par seed.sh sans passer
  # par Symphony)
  discovery:
    interval: 1m
    sources:
      - group: services
        scm: gitlab-local
        ci: gitlab-ci
        registry: gitlab-registry

# Stacks proposées : le catalogue officiel de Symphony, et celles de la
# plateforme (variantes Kubernetes et GitHub) ; une stack du repo remplace
# l'officielle du même nom
stacks:
  repo: platform/symphony-stacks
  branch: main
  path: stacks
  official: ["*"]

# slack:début — retiré par up.sh sans SLACK_WEBHOOK_URL. Les équipes sont
# prévenues dans Slack (approbations, déploiements) ; sans lui, la cloche de
# Symphony suffit aux leads.
notifications:
  url: "http://localhost:${SYMPHONY_PORT}"
  default: [slack]
# slack:fin

# Connexion par le provider identity keycloak (realm de démo : alice admin,
# lina lead de team-payments, bob developer, carol viewer, dave sans rôle ;
# mot de passe = identifiant)
auth:
  identity: keycloak
  roles:
    admin: [symphony-admins]
    lead: [symphony-leads]
    developer: [symphony-developers]
    viewer: [symphony-viewers]
