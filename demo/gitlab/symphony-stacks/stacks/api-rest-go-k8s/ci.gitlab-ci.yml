image: golang:{{params.go_version}}-alpine

stages:
  - test
  - build

variables:
  CGO_ENABLED: "0"
  GOFLAGS: "-mod=readonly"

test:
  stage: test
  script:
    - go vet ./...
    - go test -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out
  coverage: '/total:\t+\(statements\)\t+([0-9.]+)%/'
  only:
    - merge_requests
    - main

# Image publiée sur le registry du projet (:<sha court> et :latest), que
# Symphony déploie. Un runner qui monte le socket Docker (démo) construit
# directement ; sur gitlab.com, ou avec DOCKER_DIND=true dans les variables
# CI du groupe, le build passe par un service docker:dind.
.build:
  stage: build
  image: docker:24
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest

build:
  extends: .build
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_SERVER_HOST != "gitlab.com" && $DOCKER_DIND != "true"

build-dind:
  extends: .build
  services: [docker:24-dind]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && ($CI_SERVER_HOST == "gitlab.com" || $DOCKER_DIND == "true")
