apiVersion: symphony/v1
kind: Stack
metadata:
  name: api-rest-python-github
  title: API REST Python (GitHub)
  description: API FastAPI hébergée sur GitHub, testée par GitHub Actions, image publiée sur GHCR
  icon: python
spec:
  language: python
  type: api
  providers:
    scm: github
    ci: github-actions
    registry: ghcr
    runtime: docker-local
  ci_template: ci.github-actions.yml
  parameters:
    - name: python_version
      title: Version de Python
      description: Fixée par l'équipe plateforme (images de build validées)
      type: choice
      choices: ["3.12", "3.13"]
      default: "3.12"
      locked: true
    - name: log_level
      title: Niveau de journalisation
      description: Par défaut ; la variable LOG_LEVEL le change au déploiement
      type: choice
      choices: [debug, info, warning, error]
      default: info
