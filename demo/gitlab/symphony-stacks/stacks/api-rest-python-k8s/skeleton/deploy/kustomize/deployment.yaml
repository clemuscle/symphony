apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app.kubernetes.io/name: {{SERVICE_NAME}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{SERVICE_NAME}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{SERVICE_NAME}}
    spec:
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
