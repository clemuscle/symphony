# Fiche catalogue du service (Component Backstage), lue par Symphony toutes les 15 s.
# À tenir à jour par l'équipe : owner, tier, SLO, liens, dépendances, actions.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: notification-service
  description: Envoi des e-mails et des notifications push
  tags: [node, rest-api, notifications]
  labels:
    stack: api-rest-node
  annotations:
    backstage.io/source-location: url:__REPO_URL__/
    symphony.io/tier: standard
    symphony.io/language: node
    symphony.io/version: 0.9.0
    symphony.io/team-name: Produit
    symphony.io/team-slack: "#team-product"
    symphony.io/team-email: product@demo.symphony
  links:
    - title: Repository
      url: __REPO_URL__
      icon: code
    - title: Pipelines
      url: __REPO_URL__/-/pipelines
      icon: ci
    - title: Application Argo CD
      url: __ARGOCD_URL__/applications/argocd/notification-service-production
      icon: web
spec:
  type: api
  lifecycle: staging
  owner: team-product
  dependsOn:
    - component:auth-service
    - resource:rabbitmq
  slo:
    availability: "99.5%"
    latency_p99: 500ms
  actions:
    - name: Relancer la pipeline
      description: Relance la pipeline CI sur main
      ci_provider: gitlab-ci
