# Fiche catalogue du service (Component Backstage), lue par Symphony toutes les 15 s.
# À tenir à jour par l'équipe : owner, tier, SLO, liens, dépendances, actions.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: auth-service
  description: Authentification des utilisateurs et émission des jetons
  tags: [python, rest-api, auth]
  labels:
    stack: api-rest-python-k8s
  annotations:
    backstage.io/source-location: url:__REPO_URL__/
    symphony.io/tier: critical
    symphony.io/language: python
    symphony.io/version: 1.4.0
    symphony.io/team-name: Identité
    symphony.io/team-slack: "#team-identity"
    symphony.io/team-email: identity@demo.symphony
  links:
    - title: Repository
      url: __REPO_URL__
      icon: code
    - title: Pipelines
      url: __REPO_URL__/-/pipelines
      icon: ci
spec:
  type: api
  lifecycle: production
  owner: team-identity
  dependsOn:
    - resource:postgres-identity
    - resource:redis-sessions
  # k8s:début
  # Base PostgreSQL du service (écrite par la stack) : une par environnement,
  # appliquée par Argo CD avec lui ; l'appli lit son URI dans DATABASE_URL
  infra:
    kubernetes: deploy/infra
    env:
      DATABASE_URL: { secret: db-app, key: uri }
  # k8s:fin
  slo:
    availability: "99.95%"
    latency_p99: 120ms
  actions:
    - name: Relancer la pipeline
      description: Relance la pipeline CI sur main
      ci_provider: gitlab-ci
