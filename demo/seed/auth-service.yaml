# Fiche catalogue du service, lue par Symphony toutes les 15 s.
# À tenir à jour par l'équipe : owner, tier, SLO, liens, dépendances, actions.
apiVersion: symphony/v1
kind: Service
metadata:
  name: auth-service
  owner: team-identity
  team:
    name: Identité
    slack: "#team-identity"
    email: identity@demo.symphony
  tags: [python, rest-api, auth]
  tier: critical
  lifecycle: production
  labels:
    stack: api-rest-python-k8s
spec:
  type: api
  language: python
  version: 1.4.0
  repo: __REPO_URL__
  # k8s:début
  # Base PostgreSQL du service (écrite par la stack) : une par environnement,
  # appliquée par Argo CD avec lui ; l'appli lit son URI dans DATABASE_URL
  infra:
    kubernetes: deploy/infra
    env:
      DATABASE_URL: { secret: db-app, key: uri }
  # k8s:fin
  links:
    - title: Repository
      url: __REPO_URL__
      icon: code
    - title: Pipelines
      url: __REPO_URL__/-/pipelines
      icon: ci
  dependencies:
    - service: postgres-identity
      type: database
    - service: redis-sessions
      type: cache
  slo:
    availability: "99.95%"
    latency_p99: 120ms
  actions:
    - name: Relancer la pipeline
      description: Relance la pipeline CI sur main
      ci_provider: gitlab-ci
