# Fiche catalogue du service (Component Backstage), lue par Symphony toutes les 15 s.
# À tenir à jour par l'équipe : owner, tier, SLO, liens, dépendances, actions.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: payment-api
  description: Paiements, remboursements et rapprochement bancaire
  tags: [go, rest-api, kubernetes, pci]
  labels:
    stack: api-rest-go-k8s
  annotations:
    backstage.io/source-location: url:__REPO_URL__/
    symphony.io/tier: critical
    symphony.io/language: go
    symphony.io/version: 2.1.0
    symphony.io/team-name: Paiements
    symphony.io/team-slack: "#team-payments"
    symphony.io/team-email: payments@demo.symphony
  links:
    - title: Repository
      url: __REPO_URL__
      icon: code
    - title: Pipelines
      url: __REPO_URL__/-/pipelines
      icon: ci
    - title: Application Argo CD
      url: __ARGOCD_URL__/applications/argocd/payment-api-production
      icon: web
spec:
  type: api
  lifecycle: production
  owner: team-payments
  dependsOn:
    - component:auth-service
    - resource:postgres-payments
    - resource:kafka-events
  # Chart Helm du service (écrit par la stack) : déployé par Argo CD
  kubernetes:
    helm: deploy/chart
  # Variables par environnement ; les secrets sont des références, lues dans
  # Vault au déploiement (Docker) ou par External Secrets Operator (Kubernetes)
  environments:
    - name: staging
      env:
        LOG_LEVEL: debug
        DB_PASSWORD: secret://vault/apps/payment-api/db#password
    - name: production
      env:
        LOG_LEVEL: info
        DB_PASSWORD: secret://vault/apps/payment-api/db#password
  slo:
    availability: "99.99%"
    latency_p99: 200ms
  actions:
    - name: Relancer la pipeline
      description: Relance la pipeline CI sur main
      ci_provider: gitlab-ci
