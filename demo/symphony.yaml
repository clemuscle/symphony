# Bootstrap de Symphony pour la démo : la configuration est dans le repo
# root/symphony-config de la GitLab de démo (créé par up.sh).
config_source:
  scm:
    type: gitlab
    config:
      url: http://gitlab:${GITLAB_PORT}
      token_env: GITLAB_TOKEN
  repo: root/symphony-config
  branch: main
  path: symphony.yaml
