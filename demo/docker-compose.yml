# Démo Symphony : GitLab CE + Runner + PostgreSQL + Keycloak + Vault +
# Symphony, et Kubernetes (k3s + Argo CD) pour le runtime GitOps.
#
# Ne pas lancer directement : ./demo/up.sh démarre GitLab, l'initialise
# (token, repos symphony-config et symphony-stacks, runner) puis Symphony.
#
# Les ports sont réglables (variables d'environnement ou demo/.env) pour
# cohabiter avec une autre GitLab :
#   GITLAB_PORT (8929), REGISTRY_PORT (5050), GITLAB_SSH_PORT (2224), SYMPHONY_PORT (8080),
#   KEYCLOAK_PORT (8180), VAULT_PORT (8200), K8S_HTTP_PORT (8081), ARGOCD_PORT (8088),
#   K8S_API_PORT (6443)
#
# GitLab est vu sous deux noms : http://gitlab:<port> depuis les conteneurs
# (Symphony, runner), http://localhost:<port> depuis la machine (navigateur,
# jobs CI en réseau hôte, daemon Docker qui tire les images). Le port interne
# est donc le même que le port publié.

name: symphony-demo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: symphony
      POSTGRES_PASSWORD: symphony123
      POSTGRES_DB: symphony
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U symphony"]
      interval: 5s
      timeout: 3s
      retries: 10

  gitlab:
    image: gitlab/gitlab-ce:18.10.0-ce.0
    hostname: gitlab
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:${GITLAB_PORT:-8929}'
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2224}
        # Généré par up.sh (demo/.env), pris en compte au premier démarrage seulement
        gitlab_rails['initial_root_password'] = '${GITLAB_ROOT_PASSWORD:?lancer ./demo/up.sh}'
        # Registry sur localhost : le daemon Docker l'accepte en HTTP sans
        # réglage « insecure-registries »
        registry_external_url 'http://localhost:${REGISTRY_PORT:-5050}'
        # Auto DevOps ajouterait ses propres jobs à côté de ceux de la stack
        # (up.sh le désactive aussi en base : ce réglage seul ne suffit pas)
        gitlab_rails['auto_devops_enabled'] = false
        # Connexion par Keycloak, comme pour Symphony : les comptes du realm
        # (créés dans GitLab par up.sh, liés par leur e-mail) et leurs groupes.
        # Le navigateur passe par localhost:<KEYCLOAK_PORT>, GitLab échange le
        # code et vérifie les jetons sur keycloak:8080 ; d'où discovery: false.
        gitlab_rails['omniauth_allow_single_sign_on'] = ['openid_connect']
        gitlab_rails['omniauth_auto_link_user'] = ['openid_connect']
        gitlab_rails['omniauth_block_auto_created_users'] = false
        gitlab_rails['omniauth_providers'] = [{
          name: 'openid_connect',
          label: 'Keycloak',
          args: {
            name: 'openid_connect',
            scope: ['openid', 'profile', 'email'],
            response_type: 'code',
            issuer: 'http://localhost:${KEYCLOAK_PORT:-8180}/realms/symphony',
            discovery: false,
            uid_field: 'preferred_username',
            pkce: true,
            client_options: {
              identifier: 'gitlab',
              secret: '${GITLAB_OIDC_SECRET:?lancer ./demo/up.sh}',
              redirect_uri: 'http://localhost:${GITLAB_PORT:-8929}/users/auth/openid_connect/callback',
              authorization_endpoint: 'http://localhost:${KEYCLOAK_PORT:-8180}/realms/symphony/protocol/openid-connect/auth',
              token_endpoint: 'http://keycloak:8080/realms/symphony/protocol/openid-connect/token',
              userinfo_endpoint: 'http://keycloak:8080/realms/symphony/protocol/openid-connect/userinfo',
              jwks_uri: 'http://keycloak:8080/realms/symphony/protocol/openid-connect/certs',
              end_session_endpoint: 'http://localhost:${KEYCLOAK_PORT:-8180}/realms/symphony/protocol/openid-connect/logout'
            }
          }
        }]
        # Allégé pour un laptop
        puma['worker_processes'] = 2
        sidekiq['concurrency'] = 5
        prometheus_monitoring['enable'] = false
        alertmanager['enable'] = false
        node_exporter['enable'] = false
        redis_exporter['enable'] = false
        postgres_exporter['enable'] = false
        gitlab_exporter['enable'] = false
    ports:
      - "${GITLAB_PORT:-8929}:${GITLAB_PORT:-8929}"
      - "${REGISTRY_PORT:-5050}:${REGISTRY_PORT:-5050}"
      - "${GITLAB_SSH_PORT:-2224}:22"
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    shm_size: 256m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${GITLAB_PORT:-8929}/users/sign_in"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 180s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?lancer ./demo/up.sh}
      # Même principe que GitLab : le navigateur voit http://localhost:<port>,
      # Symphony joint http://keycloak:8080 (jetons, clés). L'issuer des jetons
      # reste l'URL du navigateur.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      # Realm généré par up.sh depuis keycloak/realm-symphony.template.json
      - ./keycloak/import:/opt/keycloak/data/import:ro

  # Secrets de Symphony (jetons GitLab, Argo CD, GitHub, secret des webhooks,
  # client de l'annuaire Keycloak), écrits par up.sh. Mode dev : en mémoire,
  # déjà descellé ; up.sh réécrit tout à chaque lancement.
  vault:
    image: hashicorp/vault:2.1.1
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:?lancer ./demo/up.sh}
      SKIP_SETCAP: "true"
    ports:
      - "${VAULT_PORT:-8200}:8200"

  gitlab-runner:
    image: gitlab/gitlab-runner:v18.11.3
    volumes:
      # Les jobs utilisent le daemon Docker de la machine (build et push d'image)
      - /var/run/docker.sock:/var/run/docker.sock
      - runner_config:/etc/gitlab-runner
    restart: unless-stopped

  symphony:
    # Image publiée par défaut ; SYMPHONY_IMAGE=symphony:local pour tester un build local
    image: ${SYMPHONY_IMAGE:-ghcr.io/clemuscle/symphony:latest}
    profiles: ["symphony"] # démarré par up.sh une fois GitLab initialisé
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    environment:
      # Les jetons (GitLab, Argo CD, GitHub, webhooks, annuaire) sont dans
      # Vault : Symphony n'a que son AppRole, créé par up.sh
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:-}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      DB_HOST: postgres
      GITLAB_PORT: ${GITLAB_PORT:-8929}
      REGISTRY_PORT: ${REGISTRY_PORT:-5050}
      KEYCLOAK_PORT: ${KEYCLOAK_PORT:-8180}
      # Liens des notifications : Symphony vu par le navigateur
      SYMPHONY_PORT: ${SYMPHONY_PORT:-8080}
      # Runtime argocd : port public de l'Ingress
      K8S_HTTP_PORT: ${K8S_HTTP_PORT:-8081}
    ports:
      - "${SYMPHONY_PORT:-8080}:8080"
    volumes:
      - ./symphony.yaml:/symphony.yaml:ro

  # Runtime docker-local : Symphony ne monte pas le socket Docker (un accès root
  # à la machine) ; il passe par ce proxy, qui n'ouvre que les conteneurs et les
  # images (pas exec, volumes, réseaux, swarm, système…). Créer un conteneur
  # reste un droit fort : ce runtime est fait pour un poste ou une démo, pas
  # pour une machine partagée (en production : runtime argocd).
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    profiles: ["symphony"]
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      DELETE: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Kubernetes : k3s, la distribution que k3d fait tourner dans Docker ; up.sh
  # y installe Argo CD. Les services déployés en GitOps répondent sur
  # http://<service>.localhost:<K8S_HTTP_PORT> (Ingress Traefik).
  k3s:
    image: rancher/k3s:v1.33.4-k3s1
    profiles: ["k8s"]
    hostname: k3s # nom du nœud : les pods le résolvent (NodeHosts de CoreDNS)
    privileged: true
    command: ["server", "--disable=metrics-server", "--tls-san=localhost"]
    tmpfs: [/run, /var/run]
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
      K3S_KUBECONFIG_MODE: "644"
    ports:
      - "${K8S_HTTP_PORT:-8081}:80" # Ingress
      - "${ARGOCD_PORT:-8088}:30080" # Argo CD (UI et API), NodePort
      - "${K8S_API_PORT:-6443}:6443" # API Kubernetes (demo/k3s/kubeconfig.yaml)
    volumes:
      - k3s_data:/var/lib/rancher/k3s
      # Généré par up.sh : registry de GitLab en HTTP, avec un jeton read_registry
      - ./k3s/registries.yaml:/etc/rancher/k3s/registries.yaml:ro
      - ./k3s/output:/output

  # Relais vers GitLab (et Vault, pour External Secrets) dans le réseau de k3s. GitLab est configuré sur
  # localhost (external_url) : le registry renvoie vers
  # http://localhost:<GITLAB_PORT>/jwt/auth pour les jetons. Avec ce relais,
  # localhost:<GITLAB_PORT> et localhost:<REGISTRY_PORT> mènent à GitLab pour
  # containerd, comme pour le daemon Docker de la machine ; les pods (Argo CD)
  # le joignent sur k3s:<GITLAB_PORT>.
  gitlab-proxy:
    image: alpine/socat:1.8.0.3
    profiles: ["k8s"]
    network_mode: service:k3s
    entrypoint: ["sh", "-c"]
    command:
      - >-
        socat TCP-LISTEN:8200,fork,reuseaddr TCP:vault:8200 &
        socat TCP-LISTEN:${GITLAB_PORT:-8929},fork,reuseaddr TCP:gitlab:${GITLAB_PORT:-8929} &
        exec socat TCP-LISTEN:${REGISTRY_PORT:-5050},fork,reuseaddr TCP:gitlab:${REGISTRY_PORT:-5050}
    restart: unless-stopped

volumes:
  postgres_data:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  runner_config:
  k3s_data:
